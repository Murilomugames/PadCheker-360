name: Build PadCheck 360 XEX

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**/*.c'
      - '**/*.h'
      - 'CMakeLists.txt'
      - '.github/workflows/build-xex.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Xbox 360 XEX
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Download PadCheck 360 source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git

      - name: Download xsdk
        run: git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"

      - name: Build Xbox 360 GCC toolchain
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" \
          WORK="$HOME/xsdk-gcc-work" \
          JOBS="$(nproc)" \
          tools/toolchain/build.sh

      - name: Build xsdk libraries
        run: |
          cd "$HOME/xsdk"
          make -j"$(nproc)"

      - name: Build PadCheck 360
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          test -s build/padcheck360.xex

      - name: Upload XEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: PadCheck360-v0.2.0-XEX
          path: build/padcheck360.xex
          if-no-files-found: error
          retention-days: 14
